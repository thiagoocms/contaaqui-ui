<img class="logo" src="assets/logo-h.png" alt="logo"/>
<div class="arrow-left"
     (click)="changeStep(-1)">
  <fa-icon [icon]="arrowLeft"></fa-icon>
</div>
<div class="row">

  <div class="col-4">

    <div class="row">

      <div class="col-6 d-flex justify-content-center align-items-center">
        <app-step-indicator [stepIndex]="step" [stepReference]="1"/>
      </div>
      <div class="col-6 px-0">
        <div class="row fw-bold text-muted">
          Dados
        </div>
        <div class="row text-muted fs-14 text-start">
          Informe os seus dados pessoais
        </div>
      </div>
    </div>
  </div>
  <div class="col-4">
    <div class="row">
      <div class="col-6 d-flex justify-content-center align-items-center">
        <app-step-indicator [stepIndex]="step" [stepReference]="2"/>

      </div>
      <div class="col-6 px-0">
        <div class="row fw-bold text-muted">
          Contato
        </div>
        <div class="row text-muted fs-14 text-start">
          Informe os seus contatos
        </div>
      </div>
    </div>
  </div>
  <div class="col-4">
    <div class="row">
      <div class="col-6 d-flex justify-content-center align-items-center">
        <app-step-indicator [stepIndex]="step" [stepReference]="stepReference"/>

      </div>
      <div class="col-6 px-0">
        <div class="row fw-bold text-muted">
          Senha
        </div>
        <div class="row text-muted fs-14 text-start">
          Crie uma senha segura
        </div>
      </div>
    </div>
  </div>
</div>
<form [formGroup]="form" class="m-5">

  @switch (step) {
    @case (1) {
      <div class="mt-2">
        <app-input
          formControlName="name"
          label="Nome Completo"
          type="text"
        />
      </div>

      <div class="mt-2">
        <app-input
          formControlName="document"
          label="CPF / CNPJ"
          type="text"
          [pipe]="documentPipe"
          [maxLength]="20"
        />
      </div>
    }
    @case (2) {
      <div class="mt-2">
        <app-input
          formControlName="login"
          label="Login"
          type="text"
        />
      </div>

      <div class="mt-2">
        <app-input
          formControlName="email"
          label="E-mail"
          type="email"
        />
      </div>
    }
    @case (3) {
      <div class="mt-2">
        <app-input-password
          [formG]="form"
          formName="password"
        />
      </div>

      <div class="mt-2">
        <app-input-password
          label="Confirme a senha"
          [formG]="form"
          formName="confirmPassword"
        />
      </div>
    }
    @default {
      <div class="text-center rounded-3 bg-light border shadow-sm p-4">
        <h5 class="fw-bold mb-2">
          Bem-vindo ao <span class="">Conta Aqui</span>!
        </h5>
        <p class="text-muted mb-0">
          Vamos iniciar o seu cadastro?
        </p>
      </div>
    }
  }

</form>
<div class="mt-3 ms-5 me-5">
  <button class="w-100 p-3  btn org-bg-primary" (click)="changeStep()">{{buttonMsg}}</button>
</div>
