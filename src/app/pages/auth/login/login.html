<form  class="ms-5 me-5" [formGroup]="form" (ngSubmit)="submit()">
  <img class="logo" src="./assets/logo-h.png" alt="logo"/>

  <div class="mt-2">
    <app-input
      label="Login"
      type="text"
      formControlName="login"
    />
  </div>

  <div class="mt-3">
    <app-input-password
      [formG]="form"
      formName="password"
    />
  </div>

  <div class="mt-3">
    <button class="w-100 p-3  btn org-bg-primary" type="submit" [disabled]="form.invalid">Entrar</button>
  </div>
</form>
<div class="d-flex justify-content-center align-items-center w-100 mt-4"><span class="view"></span> OU <span
  class="view"></span></div>

<div class="mt-4">
  Não tem acesso?<button class="btn btn-link" routerLink="/auth/register">Crie sua conta</button>
</div>
